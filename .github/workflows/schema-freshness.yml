name: schema-freshness

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  regen-is-fresh:
    # Skips draft PRs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # buf exports the protos + deps for protoc. No remote plugins — codegen is grpcio-tools' protoc.
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.73.0"
          # No default token: the release lookup that resolves the download URL would go out
          # anonymous, against a per-IP rate limit shared across the hosted runner pool.
          github_token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run --locked --group codegen python scripts/regen.py
      # The committed stubs must equal what regen just produced. `git add -A` stages edits, new
      # files, and deletions; a non-empty staged diff means a .proto (or a tool) changed without
      # regenerating.
      - name: Fail if committed stubs are stale
        run: |-
          git add -A
          if ! git diff --cached --exit-code; then
            echo "::error::Generated stubs are stale. Run 'uv run --group codegen python scripts/regen.py' and commit the result."
            exit 1
          fi
